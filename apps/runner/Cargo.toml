# oasd-runner ??the thin Runner application (Phase 1a of the Runner/Studio split).
#
# The whole Runner capability (HTTP surface, embedded scheduler, package
# install, runner config, ?? lives in the `oasd` engine *library*. This package
# only ships the binary, so the Runner can be built from this repository alone.
#
# Phase 1b (current): `oasd` is pinned to an oas-core **git commit** (no tag is
# cut yet; the commit hash is the source of truth). Bump `rev` deliberately
# after an oas-core change, rebuild and commit the updated Cargo.lock.
#
# 7ce1827 = oas-core seq195 (condition appear false; variables_schema/package_schema=2),
# which adds `oasd::cli::run_as_with_args`, which the
# Runner app uses to inject its own default `--ui ui` (see src/main.rs).
[package]
name = "oasd-runner"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "oasd-runner"
path = "src/main.rs"

[dependencies]
oasd = { git = "https://github.com/passioki/oas-core", rev = "7ce1827f2080c9e1196d3a5ac05a8606f9b256a6", features = ["ocr"] }
