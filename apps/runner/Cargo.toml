# oasd-runner —— Runner/Studio 分离的轻薄 Runner 应用（Phase 1a）。
#
# 全部 Runner 能力（HTTP 接口、内嵌调度、包安装、Runner 配置等）都在
# `oasd` 引擎*库*中。本包只提供二进制，因此仅靠本仓即可构建 Runner。
#
# Phase 1b（当前）：`oasd` 固定到 oas-core 的 **git 提交**（尚未打 tag；
# 提交哈希即事实来源）。oas-core 变更后需有意 bump `rev`，重新构建并提交
# 更新后的 Cargo.lock。
#
# b4affb9 = oas-core seq231 (compiled inline; logs; drawer)
# 其中新增 `oasd::cli::run_as_with_args`，Runner 应用用它注入自己的
# 默认 `--ui ui`（见 src/main.rs）。
[package]
name = "oasd-runner"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "oasd-runner"
path = "src/main.rs"

[dependencies]
oasd = { git = "https://github.com/passioki/oas-core", rev = "d4e0fd5", features = ["ocr"] }
